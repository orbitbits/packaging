name: Publish Package Repositories

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/publish.yml'
      - 'CNAME'
  workflow_dispatch:
    inputs:
      package_type:
        description: 'Package type to import: deb or rpm'
        required: false
      source_repository:
        description: 'Repository that owns the release assets, e.g. orbitbits/tildr-deb'
        required: false
      tag:
        description: 'Release tag to download, e.g. v0.3.3'
        required: false
      run_id:
        description: 'Workflow run id to download Actions artifacts from'
        required: false
      artifact_pattern:
        description: 'Actions artifact name pattern, e.g. tildr-deb-*'
        required: false
  repository_dispatch:
    types: [publish-package]

concurrency:
  group: package-repositories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout current GitHub Pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-current

      - name: Prepare public tree
        run: |
          mkdir -p public
          if [ -d gh-pages-current ]; then
            tar --exclude='./.git' -C gh-pages-current -cf - . | tar -C public -xf -
          fi
          find public -name '.nojekyll' -type f -delete
          rm -f \
            public/orbitbits-packaging-pub.gpg \
            public/orbitbits.gpg \
            public/tildr-deb-pub.gpg \
            public/tildr-rpm-pub.gpg \
            public/orbitbits.list \
            public/tildr.list \
            public/orbitbits.repo \
            public/tildr.repo \
            public/keys/orbitbits-packaging-pub.gpg \
            public/deb/orbitbits-packaging-pub.gpg \
            public/deb/orbitbits.gpg \
            public/deb/tildr-deb-pub.gpg \
            public/deb/tildr.list \
            public/rpm/orbitbits-packaging-pub.gpg \
            public/rpm/orbitbits.gpg \
            public/rpm/tildr-rpm-pub.gpg \
            public/rpm/tildr.repo
          rm -rf public/rpm/fedora

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c rpm gnupg unzip

      - name: Import GPG key
        id: gpg
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          if [ -z "$fpr" ]; then
            echo "::error::No GPG secret key found after import"
            exit 1
          fi
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - name: Resolve package input
        id: package
        run: |
          package_type="${{ github.event.client_payload.package_type || inputs.package_type }}"
          source_repository="${{ github.event.client_payload.source_repository || inputs.source_repository }}"
          tag="${{ github.event.client_payload.tag || inputs.tag }}"
          run_id="${{ github.event.client_payload.run_id || inputs.run_id }}"
          artifact_pattern="${{ github.event.client_payload.artifact_pattern || inputs.artifact_pattern }}"

          echo "package_type=${package_type}" >> "$GITHUB_OUTPUT"
          echo "source_repository=${source_repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "artifact_pattern=${artifact_pattern}" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts from workflow run
        if: steps.package.outputs.run_id != ''
        env:
          ORBITBITS_PACKAGING_TOKEN: ${{ secrets.ORBITBITS_PACKAGING_TOKEN }}
          FALLBACK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_type="${{ steps.package.outputs.package_type }}"
          source_repository="${{ steps.package.outputs.source_repository }}"
          run_id="${{ steps.package.outputs.run_id }}"
          artifact_pattern="${{ steps.package.outputs.artifact_pattern }}"

          test -n "$package_type"
          test -n "$source_repository"
          test -n "$run_id"

          case "$package_type" in
            deb)
              target_dir="tmp-debs"
              extension="deb"
              ;;
            rpm)
              target_dir="tmp-rpms"
              extension="rpm"
              ;;
            *)
              echo "::error::Unsupported package_type: ${package_type}"
              exit 1
              ;;
          esac

          if [ -z "$artifact_pattern" ]; then
            artifact_pattern="*"
          fi

          export GH_TOKEN="$(printf '%s' "${ORBITBITS_PACKAGING_TOKEN:-$FALLBACK_GITHUB_TOKEN}" | tr -d '\r\n')"
          mkdir -p tmp-artifacts "$target_dir"

          gh api --paginate "repos/${source_repository}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' \
            > tmp-artifacts/artifacts.tsv

          matched=0
          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [[ "$artifact_name" == $artifact_pattern ]]; then
              matched=$((matched + 1))
              gh api "repos/${source_repository}/actions/artifacts/${artifact_id}/zip" \
                > "tmp-artifacts/${artifact_name}.zip"
            fi
          done < tmp-artifacts/artifacts.tsv

          if [ "$matched" -eq 0 ]; then
            echo "::error::No Actions artifact matched '${artifact_pattern}' in ${source_repository} run ${run_id}"
            exit 1
          fi

          for zip_file in tmp-artifacts/*.zip; do
            unzip -o "$zip_file" -d "$target_dir"
          done

          if ! find "$target_dir" -name "*.${extension}" -type f | grep -q .; then
            echo "::error::No .${extension} files found in downloaded Actions artifacts"
            exit 1
          fi

          find "$target_dir" -name "*.${extension}" -type f -exec ls -lh {} \;

      - name: Download DEB artifacts
        if: steps.package.outputs.package_type == 'deb' && steps.package.outputs.run_id == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${{ steps.package.outputs.source_repository }}"
          test -n "${{ steps.package.outputs.tag }}"
          mkdir -p tmp-debs
          gh release download "${{ steps.package.outputs.tag }}" \
            --repo "${{ steps.package.outputs.source_repository }}" \
            -p "*.deb" \
            -D tmp-debs/ \
            --skip-existing
          find tmp-debs -name "*.deb" -exec ls -lh {} \;

      - name: Import DEB artifacts
        if: steps.package.outputs.package_type == 'deb'
        run: bash scripts/import-debs.sh public tmp-debs

      - name: Download RPM artifacts
        if: steps.package.outputs.package_type == 'rpm' && steps.package.outputs.run_id == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "${{ steps.package.outputs.source_repository }}"
          test -n "${{ steps.package.outputs.tag }}"
          mkdir -p tmp-rpms
          gh release download "${{ steps.package.outputs.tag }}" \
            --repo "${{ steps.package.outputs.source_repository }}" \
            -p "*.rpm" \
            -D tmp-rpms/ \
            --skip-existing
          find tmp-rpms -name "*.rpm" -exec ls -lh {} \;

      - name: Import RPM artifacts
        if: steps.package.outputs.package_type == 'rpm'
        run: bash scripts/import-rpms.sh public tmp-rpms

      - name: Build repositories
        env:
          SIGN_REPO: "true"
          SIGN_RPMS: "true"
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          echo "${{ secrets.GPG_PASSPHRASE }}" > /tmp/.gpg-passphrase
          export GPG_PASSPHRASE_FILE=/tmp/.gpg-passphrase
          bash scripts/build-all.sh public
          rm -f /tmp/.gpg-passphrase

      - name: Export public keys
        run: |
          mkdir -p public/keys
          gpg --batch --yes --export -a "${{ steps.gpg.outputs.fingerprint }}" > /tmp/orbitbits.gpg
          test -s /tmp/orbitbits.gpg
          cp /tmp/orbitbits.gpg public/keys/orbitbits.gpg

      - name: Keep configured custom domain
        run: |
          cp CNAME public/CNAME

      - name: Regenerate directory indexes
        run: bash scripts/generate-index.sh public

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          keep_files: false
          destination_dir: .
          enable_jekyll: true
