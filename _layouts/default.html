<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ "/" | relative_url }}">{{ site.data.generic.brand.name }}</a>
      <nav aria-label="Package repositories">
        <a href="{{ "/deb/" | relative_url }}">DEB</a>
        <a href="{{ "/rpm/" | relative_url }}">RPM</a>
        <a href="{{ "/keys/orbitbits.gpg" | relative_url }}">GPG key</a>
      </nav>
    </header>
    <main class="page">
      {{ content }}
    </main>
  </body>
</html>
